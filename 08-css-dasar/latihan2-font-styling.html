<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        text-align: center;
        font-weight: bold;
      }
      h1 {
        font-size: 48px;
        font-style: italic;
        text-transform: uppercase;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: brown;
        text-shadow: 5px 5px 0 rgba(153, 156, 148, 0.428);
        letter-spacing: 10px;
      }

      p {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
      }

      .credit {
        font-size: 12px;
        font-weight: normal;
        letter-spacing: 2px;
        color: rgb(161, 148, 148);
      }
    </style>
  </head>
  <body>
    <h1>Life & Perspective</h1>
    <p>
      I'm selfish, impatient and a little insecure. <br />
      I make mistakes, I am out of
      <span style="text-decoration: line-through; color: rgb(143, 158, 154)"
        >control</span
      >
      and at times hard to handle. <br />
      But if you can't handle me at my worst, <br />
      then you sure as hell don't deserve me at my best. <br />
      <span class="credit">— Marilyn Monroe</span>
    </p>
  </body>
</html>
