<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        text-align: center;
        font-weight: bold;
        background-color: #0d172e;
      }
      h1 {
        font-size: 48px;
        font-style: italic;
        text-transform: uppercase;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: #37435e;
        text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
        letter-spacing: 10px;
        color: #42c7fc;
      }

      p {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
        color: #e6f4f8;
      }

      .credit {
        font-size: 12px;
        font-weight: normal;
        letter-spacing: 2px;
        color: rgb(161 148 148 / 70%);
      }
    </style>
  </head>
  <body>
    <h1>Life & Perspective</h1>
    <p>
      I'm selfish, impatient and a little insecure. <br />
      I make mistakes, I am out of
      <span style="text-decoration: line-through; color: crimson">control</span>
      and at times hard to handle. <br />
      But if you can't handle me at my worst, <br />
      then you sure as hell don't deserve me at my best. <br />
      <span class="credit">— Marilyn Monroe</span>
    </p>
  </body>
</html>
