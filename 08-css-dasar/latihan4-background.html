<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        text-align: center;
        font-weight: bold;
        background-color: #0d172e;
        background-image:
          linear-gradient(to bottom, rgb(15 23 42 /60%), rgb(15 23 42 /20%)),
          url("https://fastly.picsum.photos/id/377/1000/1000.jpg?hmac=X5DlFTiYUTtO6JBLOBmUOMPUAgvC8BefyGtLHNAmOWk");

        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }
      h1 {
        font-size: 4em;
        font-style: italic;
        text-transform: uppercase;
        /* text-shadow: 5px 5px 0 rgb(215 215 215 / 10%); */
        letter-spacing: 10px;
        color: transparent;
        background-image: linear-gradient(
          to right,
          rgb(100, 100, 173),
          rgb(227, 212, 227)
        );
        background-clip: text;
        filter: drop-shadow(0 0 10px rgba(176, 141, 141, 0.5));
      }

      p {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
        color: rgb(207, 217, 226);
        background-color: rgba(78, 54, 54, 0.5);
        padding: 40px;
        margin: auto;
        max-width: 700px;
        border-radius: 20px;
        border: 1px solid rgb(255 255 255/10%);
        box-shadow: 0 10px 30px rgb(0 0 0/50%);
      }

      .credit {
        font-size: 12px;
        font-weight: normal;
        letter-spacing: 2px;
        color: rgba(199, 154, 154, 0.7);
        text-transform: uppercase;
        border-top: 1px solid rgb(255 255 255/20%);
        width: 30%;
        margin: 30px auto;
        padding-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Life & Perspective</h1>
    <p>
      I'm selfish, impatient and a little insecure. <br />
      I make mistakes, I am out of
      <span
        style="
          text-decoration: none;
          color: crimson;
          text-shadow: 0 0 10px rgba(197, 154, 163, 0.6);
        "
        >control</span
      >
      and at times hard to handle. <br />
      But if you can't handle me at my worst, <br />
      then you sure as hell don't deserve me at my best. <br />
    </p>
    <span class="credit">— Marilyn Monroe</span>
  </body>
</html>
