<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Text - Text Overflow & Text Shadow</title>
    <style>
      p {
        font-size: 26px;
        white-space: nowrap;
        width: 300px;
        background-color: lightblue;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      h1 {
        font-size: 100px;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        text-shadow: 5px 5px 0 gray;
        text-decoration: underline;
        text-decoration-line: underline;
        text-decoration-style: wavy;
        text-decoration-color: lightblue;
        text-decoration-skip-ink: none;
        letter-spacing: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Hello, CSS!</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Maxime
      provident, soluta nemo velit sequi voluptatibus error totam cupiditate
      quidem explicabo placeat dolores quos impedit quod vitae nulla fuga
      pariatur officiis.
    </p>
  </body>
</html>
